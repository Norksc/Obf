[package]
name = "Obf"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "current", default-features = false, features = ["cache", "macros"] }
serenity = { version = "0.11", default-features = false, features = ["cache", "client", "gateway", "rustls_backend", "http", "utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "multipart"] }
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
aes-gcm = { version = "0.10", features = ["std"] }
sha2 = "0.10"
base64 = "0.21"
thiserror = "1"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
